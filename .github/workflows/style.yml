name: Style
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - master

jobs:
  style:
    name: Check UncertainSCI style and complexity
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: 3.12
        cache: 'pip'  # optional, adds caching for faster builds

    - name: Install UncertainSCI
      run: |
        python -m pip install --upgrade pip
        pip install --editable .["dev"]

    - name: Lint with flake8 (style and complexity)
      run: |
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

    - name: Verify code was autopep8-formatted or equivalent
      run: |
        autopep8 --in-place --recursive --max-line-length=127 .
        if ! git diff --exit-code; then
          echo "::error::Code is not autopep8-formatted. Run 'autopep8 --in-place --recursive --max-line-length=127 .' and commit the result."
          exit 1
        fi
